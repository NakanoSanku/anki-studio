name: Temporary compact settings AI UI

on:
  push:
    branches:
      - refactor/compact-settings-ai-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refine settings and AI surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Settings overview: keep only the four useful destinations and current values.
          Path("components/settings-overview.tsx").write_text('''"use client"\n\nimport { useEffect, useMemo, useState } from "react"\nimport Link from "next/link"\nimport { ChevronRight } from "lucide-react"\n\nimport { PATHS, SETTINGS_ROWS } from "@/lib/app-paths"\nimport { fsrsOf, type Deck } from "@/lib/deck"\nimport { readAiSettings } from "@/lib/ai-settings"\nimport { readGoogleSheetConnection } from "@/lib/google-sheet-connection"\nimport { productSyncMessage } from "@/lib/product-copy"\n\ntype SettingsOverviewProps = { deck?: Deck; syncMessage?: string }\n\nexport function SettingsOverview({ deck, syncMessage }: SettingsOverviewProps) {\n  const [googleUser, setGoogleUser] = useState<{ email?: string | null } | null>(null)\n\n  useEffect(() => {\n    void fetch("/api/auth/account", { cache: "no-store" })\n      .then((res) => res.json())\n      .then((data: { authenticated?: boolean; user?: { email?: string | null } }) => {\n        if (data?.authenticated && data.user) setGoogleUser(data.user)\n      })\n      .catch(() => {})\n  }, [])\n\n  const retentionPercent = useMemo(() => (deck ? Math.round(fsrsOf(deck).requestRetention * 100) : 90), [deck])\n  const aiModel = useMemo(() => {\n    try {\n      return readAiSettings().model.trim() || "gpt-4o-mini"\n    } catch {\n      return "gpt-4o-mini"\n    }\n  }, [])\n\n  const syncValue = useMemo(() => {\n    const sheet = readGoogleSheetConnection()\n    if (sheet) return sheet.name\n    if (googleUser?.email) return "Choose a sheet"\n    const message = productSyncMessage(syncMessage)\n    return message === "Not synced yet" ? "Not connected" : message\n  }, [googleUser, syncMessage])\n\n  const values: Record<string, string> = {\n    [PATHS.settingsDeck]: deck ? `${deck.cards.length} ${deck.cards.length === 1 ? "note" : "notes"}` : "",\n    [PATHS.settingsStudy]: `${retentionPercent}%`,\n    [PATHS.settingsAi]: aiModel,\n    [PATHS.settingsSync]: syncValue,\n  }\n\n  return (\n    <div className="mx-auto w-full max-w-lg pb-10" aria-label="Settings overview">\n      <div className="overflow-hidden rounded-[20px] border border-black/[0.065] bg-card dark:border-white/[0.09]">\n        {SETTINGS_ROWS.map((row, index) => (\n          <Link\n            key={row.href}\n            href={row.href}\n            className={`group flex min-h-16 items-center gap-3 px-4 py-3 transition-colors hover:bg-muted/55 active:bg-muted/80 ${index > 0 ? "border-t border-black/[0.055] dark:border-white/[0.07]" : ""}`}\n          >\n            <span className="min-w-0 flex-1 truncate text-[15px] font-semibold tracking-[-0.02em]">{row.label}</span>\n            <span className="max-w-[52%] truncate text-right text-xs font-medium text-muted-foreground">{values[row.href]}</span>\n            <ChevronRight className="size-4 shrink-0 text-foreground/20 transition-transform duration-150 group-active:translate-x-0.5" />\n          </Link>\n        ))}\n      </div>\n    </div>\n  )\n}\n''')

          # Settings navigation: labels only, no decorative section icons.
          path = Path("components/settings-form.tsx")
          source = path.read_text()
          source = replace_once(
              source,
              'import { BrainCircuit, FolderCog, Gauge, RefreshCw, Table2 } from "lucide-react"',
              'import { RefreshCw } from "lucide-react"',
              "settings icon imports",
          )
          source = replace_once(
              source,
              '''const SETTINGS_SECTIONS = [\n  { value: "deck", shortLabel: "Deck", icon: FolderCog },\n  { value: "study", shortLabel: "Study", icon: Gauge },\n  { value: "ai", shortLabel: "AI", icon: BrainCircuit },\n  { value: "sync", shortLabel: "Sync", icon: Table2 },\n] as const''',
              '''const SETTINGS_SECTIONS = [\n  { value: "deck", shortLabel: "Deck" },\n  { value: "study", shortLabel: "Study" },\n  { value: "ai", shortLabel: "AI" },\n  { value: "sync", shortLabel: "Sync" },\n] as const''',
              "settings sections",
          )
          source = replace_once(source, "              const Icon = item.icon\n              return (", "              return (", "settings icon binding")
          source = replace_once(source, '                  <Icon className="size-4" />\n                  <span className="min-w-0 truncate text-left">{item.shortLabel}</span>', '                  <span className="min-w-0 truncate text-left">{item.shortLabel}</span>', "settings icon render")
          path.write_text(source)

          # AI settings: remove the marketing hero, nested decoration, and prompt icons/descriptions.
          path = Path("components/ai-settings-panel.tsx")
          source = path.read_text()
          source = replace_once(
              source,
              '''import {\n  AlertCircle,\n  Check,\n  ChevronRight,\n  Copy,\n  Eye,\n  EyeOff,\n  LoaderCircle,\n  RefreshCw,\n  RotateCcw,\n  Save,\n  Sparkles,\n  WandSparkles,\n  Zap,\n} from "lucide-react"''',
              '''import {\n  Check,\n  ChevronRight,\n  Copy,\n  Eye,\n  EyeOff,\n  RotateCcw,\n  Save,\n} from "lucide-react"''',
              "AI icon imports",
          )
          start_marker = '  return (\n    <div className="mx-auto w-full max-w-xl space-y-5 pb-12">'
          sheet_marker = '      <Sheet open={Boolean(editingPromptKey)} onOpenChange={(open) => !open && setEditingPromptKey(null)}>'
          start = source.index(start_marker)
          sheet = source.index(sheet_marker, start)
          before = source[:start]
          after = source[sheet:]
          compact = '''  return (\n    <div className="mx-auto w-full max-w-xl space-y-4 pb-10">\n      <section className="rounded-[20px] border border-black/[0.065] bg-card p-4 dark:border-white/[0.09]">\n        <div className="mb-4 flex items-center justify-between gap-3">\n          <h2 className="text-lg font-semibold tracking-[-0.03em]">Provider</h2>\n          <Button type="button" size="sm" variant="ghost" className="h-8 px-2 text-xs text-muted-foreground" onClick={resetAllDefaults}>Reset</Button>\n        </div>\n\n        <div className="space-y-3">\n          <div>\n            <Label htmlFor="baseURL-input" className="text-[10px] font-semibold uppercase tracking-[0.14em] text-muted-foreground">Base URL</Label>\n            <Input id="baseURL-input" value={settings.baseURL} placeholder="https://api.openai.com/v1" className="mt-1.5 h-10 bg-background font-mono text-xs" onChange={(event) => patch({ baseURL: event.target.value })} />\n          </div>\n\n          <div>\n            <div className="flex items-center justify-between gap-2">\n              <Label htmlFor="model-input" className="text-[10px] font-semibold uppercase tracking-[0.14em] text-muted-foreground">Model</Label>\n              <button type="button" disabled={busy} onClick={() => void fetchModels()} className="text-[10px] font-medium text-muted-foreground hover:text-foreground disabled:opacity-35">{models.length > 0 ? `${models.length} models` : "Fetch models"}</button>\n            </div>\n            {models.length > 0 ? (\n              <Select value={settings.model} onValueChange={(model) => patch({ model })}>\n                <SelectTrigger id="model-input" className="mt-1.5 h-10 w-full bg-background font-mono text-xs"><SelectValue placeholder="Select a model" /></SelectTrigger>\n                <SelectContent position="popper" align="start" className="max-h-64">\n                  {!models.includes(settings.model) && settings.model ? <SelectItem value={settings.model}>{settings.model}</SelectItem> : null}\n                  {models.map((model) => <SelectItem key={model} value={model}>{model}</SelectItem>)}\n                </SelectContent>\n              </Select>\n            ) : (\n              <Input id="model-input" value={settings.model} placeholder="gpt-4o-mini" className="mt-1.5 h-10 bg-background font-mono text-xs" onChange={(event) => patch({ model: event.target.value })} />\n            )}\n          </div>\n\n          <div>\n            <div className="flex items-center justify-between gap-2">\n              <Label htmlFor="apiKey-input" className="text-[10px] font-semibold uppercase tracking-[0.14em] text-muted-foreground">API Key</Label>\n              <button type="button" onClick={() => void pasteApiKey()} className="text-[10px] font-medium text-muted-foreground hover:text-foreground">Paste</button>\n            </div>\n            <div className="relative mt-1.5">\n              <Input id="apiKey-input" type={showApiKey ? "text" : "password"} value={settings.apiKey} placeholder="Optional for keyless endpoints" className="h-10 bg-background pr-10 font-mono text-xs" onChange={(event) => patch({ apiKey: event.target.value })} />\n              <button type="button" aria-label={showApiKey ? "Hide API key" : "Show API key"} onClick={() => setShowApiKey((visible) => !visible)} className="absolute right-1.5 top-1/2 flex size-7 -translate-y-1/2 items-center justify-center rounded-[9px] text-muted-foreground hover:bg-muted hover:text-foreground">\n                {showApiKey ? <EyeOff className="size-3.5" /> : <Eye className="size-3.5" />}\n              </button>\n            </div>\n          </div>\n        </div>\n\n        {status.message ? (\n          <p role="status" className={cn("mt-3 rounded-[11px] px-3 py-2 text-xs font-medium", status.type === "error" ? "bg-destructive/8 text-destructive" : status.type === "success" ? "bg-energy/14 text-foreground" : "bg-muted/60 text-muted-foreground")}>{status.message}</p>\n        ) : null}\n\n        <div className="mt-4 grid grid-cols-2 gap-2">\n          <Button type="button" variant="outline" className="h-10" disabled={busy} onClick={() => void testConnection()}>{busy ? "Testing…" : "Test"}</Button>\n          <Button type="button" className="h-10" disabled={busy} onClick={save}>Save</Button>\n        </div>\n      </section>\n\n      <section className="overflow-hidden rounded-[20px] border border-black/[0.065] bg-card dark:border-white/[0.09]">\n        <div className="flex items-center justify-between px-4 py-3">\n          <h2 className="text-base font-semibold tracking-[-0.025em]">Prompts</h2>\n          <span className="text-[10px] font-medium text-muted-foreground">{customPromptCount > 0 ? `${customPromptCount} custom` : "Default"}</span>\n        </div>\n        {PROMPT_SPECS.map((spec, index) => {\n          const modified = settings[spec.key] !== DEFAULT_AI_SETTINGS[spec.key]\n          return (\n            <button key={spec.key} type="button" onClick={() => openPromptEditor(spec.key)} className={cn("group flex min-h-14 w-full items-center gap-3 px-4 py-3 text-left transition-colors hover:bg-muted/55 active:bg-muted/75", index >= 0 && "border-t border-black/[0.055] dark:border-white/[0.07]")}>\n              <span className="min-w-0 flex-1 truncate text-sm font-semibold">{spec.label}</span>\n              {modified ? <span className="text-[10px] font-medium text-muted-foreground">Custom</span> : null}\n              <ChevronRight className="size-4 shrink-0 text-foreground/20" />\n            </button>\n          )\n        })}\n      </section>\n\n'''
          path.write_text(before + compact + after)

          # Gemini settings mode: compact key controls only. Keep onboarding unchanged.
          path = Path("components/gemini-live-setup.tsx")
          source = path.read_text()
          marker = '  const onboarding = mode === "onboarding"\n\n  return ('
          compact_settings = '''  const onboarding = mode === "onboarding"\n\n  if (!onboarding) {\n    return (\n      <section data-testid="gemini-live-compact" className="mx-auto w-full max-w-xl rounded-[20px] border border-black/[0.065] bg-card p-4 dark:border-white/[0.09]">\n        <div className="flex items-center justify-between gap-3">\n          <h3 className="text-base font-semibold tracking-[-0.025em]">Gemini Live</h3>\n          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-[10px] font-medium text-muted-foreground underline-offset-4 hover:text-foreground hover:underline">Get key</a>\n        </div>\n        <div className="relative mt-3">\n          <Input\n            id="gemini-live-key"\n            type={showKey ? "text" : "password"}\n            value={settings.apiKey}\n            autoComplete="off"\n            placeholder="Gemini API key"\n            className="h-10 bg-background pr-10 font-mono text-xs"\n            onChange={(event) => {\n              setSettings({ apiKey: event.target.value })\n              setStatus({ type: "idle", message: "" })\n            }}\n          />\n          <button type="button" aria-label={showKey ? "Hide Gemini API key" : "Show Gemini API key"} onClick={() => setShowKey((visible) => !visible)} className="absolute right-1.5 top-1/2 flex size-7 -translate-y-1/2 items-center justify-center rounded-[9px] text-muted-foreground hover:bg-muted hover:text-foreground">\n            {showKey ? <EyeOff className="size-3.5" /> : <Eye className="size-3.5" />}\n          </button>\n        </div>\n        {status.message ? <p role="status" className={cn("mt-3 rounded-[11px] px-3 py-2 text-xs font-medium", status.type === "error" ? "bg-destructive/8 text-destructive" : status.type === "success" ? "bg-energy/14 text-foreground" : "bg-muted/60 text-muted-foreground")}>{status.message}</p> : null}\n        <div className="mt-3 grid grid-cols-2 gap-2">\n          <Button type="button" variant="outline" className="h-10" disabled={busy} onClick={() => void test()}>{busy ? "Testing…" : "Test"}</Button>\n          <Button type="button" className="h-10" disabled={busy} onClick={save}>Save</Button>\n        </div>\n      </section>\n    )\n  }\n\n  return ('''
          source = replace_once(source, marker, compact_settings, "compact Gemini settings")
          path.write_text(source)

          # Template editor: make AI action visually deliberate and compact.
          path = Path("components/template-editor.tsx")
          source = path.read_text()
          source = replace_once(
              source,
              '<Button type="button" variant="outline" onClick={() => setAiOpen(true)}><Sparkles data-icon="inline-start" />AI edit</Button>',
              '<Button type="button" variant="ghost" className="h-9 rounded-full border border-energy/30 bg-energy/15 px-3.5 text-xs font-semibold shadow-none hover:bg-energy/25" onClick={() => setAiOpen(true)}><Sparkles className="size-3.5" />Ask AI</Button>',
              "template AI action",
          )
          path.write_text(source)

          # Regression contract for the compact settings hierarchy.
          Path("tests/contracts/ui/settings-cleanup.test.ts").write_text('''import { describe, expect, it } from "vitest"\n\nimport { readSource } from "../helpers/source"\n\nconst overview = readSource("components", "settings-overview.tsx")\nconst form = readSource("components", "settings-form.tsx")\nconst ai = readSource("components", "ai-settings-panel.tsx")\nconst gemini = readSource("components", "gemini-live-setup.tsx")\nconst template = readSource("components", "template-editor.tsx")\n\nconst cjk = /[\\u3400-\\u9fff]/u\n\ndescribe("compact settings hierarchy", () => {\n  it("keeps the settings overview to destinations and current values", () => {\n    expect(overview).not.toContain("Tune the way you learn")\n    expect(overview).not.toContain("Local first")\n    expect(overview).not.toContain("Private by default")\n    expect(overview).not.toContain("FolderCog")\n    expect(overview).not.toContain("BrainCircuit")\n    expect(form).not.toContain("<Icon")\n  })\n\n  it("keeps AI settings compact without marketing copy or prompt decorations", () => {\n    expect(ai).not.toContain("A quiet AI assistant")\n    expect(ai).not.toContain("Connect an OpenAI-compatible endpoint")\n    expect(ai).not.toContain("Using default prompt")\n    expect(ai).not.toContain("WandSparkles")\n    expect(ai).toContain(">Provider</h2>")\n    expect(ai).toContain(">Prompts</h2>")\n    expect(gemini).toContain('data-testid="gemini-live-compact"')\n  })\n\n  it("uses a compact highlighted AI action in the template editor", () => {\n    expect(template).toContain(">Ask AI</Button>")\n    expect(template).toContain("border-energy/30 bg-energy/15")\n    expect(template).not.toContain(">AI edit</Button>")\n  })\n\n  it("keeps settings UI source free of Chinese interface copy", () => {\n    expect(overview).not.toMatch(cjk)\n    expect(form).not.toMatch(cjk)\n    expect(ai).not.toMatch(cjk)\n    expect(gemini).not.toMatch(cjk)\n  })\n})\n''')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/settings-overview.tsx components/settings-form.tsx components/ai-settings-panel.tsx components/gemini-live-setup.tsx components/template-editor.tsx tests/contracts/ui/settings-cleanup.test.ts
          git diff --cached --check
          git commit -m "refactor: simplify settings and AI surfaces"
          git push origin HEAD:${GITHUB_REF_NAME}
