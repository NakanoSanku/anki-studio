name: Temporary review fixes

on:
  push:
    branches:
      - fix/review-gate-sync-readme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Add behavioral regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/lib/google-sheets-sync.test.ts")
          source = path.read_text()
          old = '''        cards: [\n          { id: deck.cards[0]!.id, values: { Word: "edited from Sheets" } },\n          { values: { Word: "new from Sheets", Translation: "新增" } },\n        ],'''
          new = '''        cards: [\n          { id: deck.cards[0]!.id, reviewStatus: "pending", values: { Word: "edited from Sheets" } },\n          { reviewStatus: "pending", values: { Word: "new from Sheets", Translation: "新增" } },\n        ],'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one editable preview assertion, found {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''      deck: { cards: [{ id: deck.cards[0]!.id }] },'''
          new = '''      deck: { cards: [{ id: deck.cards[0]!.id, reviewStatus: "pending" }] },'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one delete assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/lib/google-sheets-sync.test.ts
          git diff --cached --check
          git commit -m "test: keep Sheets edits pending review"
          git push origin HEAD:${GITHUB_REF_NAME}
