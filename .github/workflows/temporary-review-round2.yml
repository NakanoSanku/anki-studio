name: Temporary review round 2

on:
  push:
    branches:
      - fix/review-gate-sync-readme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Stable typed client errors for sync payload validation.
          Path("lib/sync-errors.ts").write_text('''export type SyncRequestErrorCode =\n  | "invalid_remote_deck_payload"\n  | "invalid_remote_deck_revision"\n  | "invalid_remote_deck_content"\n  | "missing_remote_deck_content"\n  | "invalid_request"\n  | "invalid_expected_revision"\n  | "invalid_deck_content"\n  | "missing_deck_content"\n  | "invalid_remote_index"\n  | "invalid_remote_index_entry"\n  | "invalid_remote_index_revision"\n\nexport class SyncRequestError extends Error {\n  readonly status: number\n\n  constructor(\n    readonly code: SyncRequestErrorCode,\n    message: string,\n    status = 400\n  ) {\n    super(message)\n    this.name = "SyncRequestError"\n    this.status = status\n  }\n}\n''')

          # Make payload parsing English and typed so bad client payloads stay HTTP 400.
          path = Path("lib/sync-payload.ts")
          payload = path.read_text()
          payload = replace_once(
              payload,
              'import type { PutDeckBody, RemoteDeckPayload, RemoteIndexEntry } from "./sync-types"\n',
              'import type { PutDeckBody, RemoteDeckPayload, RemoteIndexEntry } from "./sync-types"\nimport { SyncRequestError } from "./sync-errors"\n',
              "sync payload error import",
          )
          payload = replace_once(
              payload,
              'export function parseRemoteDeckPayload(raw: unknown): RemoteDeckPayload {\n  if (!isRecord(raw)) throw new Error("云端卡包格式无效")\n  const rev = Number(raw.rev)\n  const updatedAt = Number(raw.updatedAt)\n  if (!Number.isInteger(rev) || rev < 0) throw new Error("云端卡包版本无效")\n\n  const deletedAt = positiveTimestamp(raw.deletedAt)\n  let deck: Deck | null = null\n  if (raw.deck != null) {\n    deck = parseDeckJson(JSON.stringify(raw.deck))\n  } else if (!deletedAt && rev !== 0) {\n    throw new Error("云端卡包缺少内容")\n  }',
              'export function parseRemoteDeckPayload(raw: unknown): RemoteDeckPayload {\n  if (!isRecord(raw)) {\n    throw new SyncRequestError("invalid_remote_deck_payload", "Invalid cloud deck payload")\n  }\n  const rev = Number(raw.rev)\n  const updatedAt = Number(raw.updatedAt)\n  if (!Number.isInteger(rev) || rev < 0) {\n    throw new SyncRequestError("invalid_remote_deck_revision", "Invalid cloud deck revision")\n  }\n\n  const deletedAt = positiveTimestamp(raw.deletedAt)\n  let deck: Deck | null = null\n  if (raw.deck != null) {\n    try {\n      deck = parseDeckJson(JSON.stringify(raw.deck))\n    } catch {\n      throw new SyncRequestError("invalid_remote_deck_content", "Cloud deck content is invalid")\n    }\n  } else if (!deletedAt && rev !== 0) {\n    throw new SyncRequestError("missing_remote_deck_content", "Cloud deck content is missing")\n  }',
              "remote payload validation",
          )
          payload = replace_once(
              payload,
              'export function parsePutBody(raw: unknown): PutDeckBody {\n  if (!isRecord(raw)) throw new Error("请求无效")\n  const expectedRev = Number(raw.expectedRev)\n  if (!Number.isInteger(expectedRev) || expectedRev < 0) throw new Error("版本无效")\n\n  const deletedAt = positiveTimestamp(raw.deletedAt)\n  const deck = raw.deck == null ? null : parseDeckJson(JSON.stringify(raw.deck))\n  if (!deletedAt && !deck) throw new Error("缺少卡包内容")',
              'export function parsePutBody(raw: unknown): PutDeckBody {\n  if (!isRecord(raw)) {\n    throw new SyncRequestError("invalid_request", "Invalid sync request")\n  }\n  const expectedRev = Number(raw.expectedRev)\n  if (!Number.isInteger(expectedRev) || expectedRev < 0) {\n    throw new SyncRequestError("invalid_expected_revision", "Invalid expected revision")\n  }\n\n  const deletedAt = positiveTimestamp(raw.deletedAt)\n  let deck: Deck | null = null\n  if (raw.deck != null) {\n    try {\n      deck = parseDeckJson(JSON.stringify(raw.deck))\n    } catch {\n      throw new SyncRequestError("invalid_deck_content", "Deck content is invalid")\n    }\n  }\n  if (!deletedAt && !deck) {\n    throw new SyncRequestError("missing_deck_content", "Deck content is missing")\n  }',
              "put payload validation",
          )
          payload = replace_once(
              payload,
              'export function parseRemoteIndex(raw: unknown): RemoteIndexEntry[] {\n  if (!Array.isArray(raw)) throw new Error("云端目录格式无效")\n  return raw.map((entry) => {\n    if (!isRecord(entry) || typeof entry.id !== "string" || !isDeckId(entry.id)) {\n      throw new Error("云端目录包含无效卡包")\n    }\n    const rev = Number(entry.rev)\n    const updatedAt = Number(entry.updatedAt)\n    const cardCount = Number(entry.cardCount)\n    if (!Number.isInteger(rev) || rev < 0) throw new Error("云端目录版本无效")',
              'export function parseRemoteIndex(raw: unknown): RemoteIndexEntry[] {\n  if (!Array.isArray(raw)) {\n    throw new SyncRequestError("invalid_remote_index", "Invalid cloud sync index")\n  }\n  return raw.map((entry) => {\n    if (!isRecord(entry) || typeof entry.id !== "string" || !isDeckId(entry.id)) {\n      throw new SyncRequestError("invalid_remote_index_entry", "Cloud sync index contains an invalid deck")\n    }\n    const rev = Number(entry.rev)\n    const updatedAt = Number(entry.updatedAt)\n    const cardCount = Number(entry.cardCount)\n    if (!Number.isInteger(rev) || rev < 0) {\n      throw new SyncRequestError("invalid_remote_index_revision", "Invalid cloud sync index revision")\n    }',
              "remote index validation",
          )
          payload = payload.replace('entry.name : "未命名卡包"', 'entry.name : "Untitled deck"')
          path.write_text(payload)

          # Typed errors are classified without language-dependent string matching.
          path = Path("lib/sync-server.ts")
          server = path.read_text()
          server = replace_once(
              server,
              'import { GOOGLE_SHEET_ID_HEADER, isGoogleSpreadsheetId } from "./google-sheet-id"\n',
              'import { GOOGLE_SHEET_ID_HEADER, isGoogleSpreadsheetId } from "./google-sheet-id"\nimport { SyncRequestError } from "./sync-errors"\n',
              "sync server typed error import",
          )
          server = replace_once(
              server,
              'export function googleSheetsErrorResponse(error: unknown, fallback: string): Response {\n  if (error instanceof GoogleSheetsApiError) {',
              'export function googleSheetsErrorResponse(error: unknown, fallback: string): Response {\n  if (error instanceof SyncRequestError) {\n    return Response.json(\n      { error: error.message, code: error.code, available: false },\n      { status: error.status }\n    )\n  }\n  if (error instanceof GoogleSheetsApiError) {',
              "typed error response",
          )
          path.write_text(server)

          # Google Sheets preview reads: dynamic width and explicit parse failures.
          path = Path("lib/google-sheets-sync.ts")
          sheets = path.read_text()
          sheets = replace_once(sheets, 'const PREVIEW_READ_RANGE = "A1:Z"\n', '', "remove fixed preview range")
          sheets = replace_once(
              sheets,
              '\nfunction internalDeckSheetTitle(deckId: string): string {',
              '\nfunction previewReadRange(deck: Pick<Deck, "fields">): string {\n  return `A1:${columnName(deck.fields.length + 1)}`\n}\n\nfunction internalDeckSheetTitle(deckId: string): string {',
              "dynamic preview range helper",
          )
          start = sheets.index('async function materializePreviewEdits(')
          end = sheets.index('\nasync function payloadForIndexVersion(', start)
          replacement = '''async function materializePreviewEdits(\n  client: GoogleSheetsClient,\n  fetchImpl: typeof fetch,\n  session?: SheetsSession | null\n): Promise<void> {\n  const storage = await ensureSyncStorage(client, fetchImpl, session)\n  await ensureExistingDeckPreviews(client, storage, fetchImpl, session)\n  const { rows } = await readIndexState(client, fetchImpl, session)\n  const currents = [...new Set(rows.map((row) => row.id))]\n    .map((id) => findCurrentIndexVersion(rows, id))\n    .filter((current): current is IndexVersion => (\n      Boolean(current && !current.row.deletedAt && current.row.sheetId != null)\n    ))\n\n  const dataQueries = currents.map((current) => ({\n    current,\n    dataSheet: dataSheetForIndex(storage.metadata, current),\n  }))\n  const readable = dataQueries.filter((item): item is typeof item & { dataSheet: DeckDataSheet } => (\n    item.dataSheet != null\n  ))\n  const dataValues = await readValuesMany(\n    client,\n    readable.map((item) => ({ sheetTitle: item.dataSheet.title, range: "A2:K" })),\n    fetchImpl,\n    session\n  )\n\n  const loaded: Array<{\n    current: IndexVersion\n    payload: RemoteDeckPayload\n  }> = []\n  readable.forEach((item, index) => {\n    const dataRows = parseSyncRows(dataValues[index] ?? [], GOOGLE_SHEETS_SCHEMA_VERSION)\n    const version = findExactVersion(\n      dataRows,\n      item.current.row.id,\n      item.current.revision,\n      item.current.versionId\n    )\n    if (!version) {\n      throw new Error(`Deck worksheet “${item.dataSheet.title}” is missing the revision referenced by the sync index`)\n    }\n    loaded.push({\n      current: item.current,\n      payload: decodePayload(version, GOOGLE_SHEETS_SCHEMA_VERSION),\n    })\n  })\n  for (const item of dataQueries) {\n    if (item.dataSheet) continue\n    const payload = await payloadForIndexVersion(client, storage.metadata, item.current, fetchImpl, session)\n    loaded.push({ current: item.current, payload })\n  }\n\n  const payloadById = new Map(loaded.map((item) => [item.current.row.id, item.payload]))\n  const previewJobs = loaded.flatMap((item) => {\n    const deck = item.payload.deck\n    if (!deck) return []\n    return previewSheetCandidates(storage.metadata, item.current.row.id, deck.name)\n      .filter((properties) => properties.title)\n      .map((properties) => ({\n        current: item.current,\n        properties,\n        sheetTitle: properties.title!,\n        range: previewReadRange(deck),\n      }))\n  })\n  const previewValues = await readValuesMany(\n    client,\n    previewJobs.map((job) => ({ sheetTitle: job.sheetTitle, range: job.range })),\n    fetchImpl,\n    session\n  )\n\n  type PreviewParseResult = {\n    properties: SheetProperties\n    deck: Deck | null\n    error: Error | null\n  }\n  const previewResultsByDeck = new Map<string, PreviewParseResult[]>()\n  previewJobs.forEach((job, index) => {\n    const deck = payloadById.get(job.current.row.id)?.deck\n    if (!deck) return\n    const list = previewResultsByDeck.get(job.current.row.id) ?? []\n    try {\n      list.push({\n        properties: job.properties,\n        deck: parsePreviewValues(deck, job.properties, previewValues[index] ?? []),\n        error: null,\n      })\n    } catch (error) {\n      list.push({\n        properties: job.properties,\n        deck: null,\n        error: error instanceof Error ? error : new Error("Unable to parse deck preview worksheet"),\n      })\n    }\n    previewResultsByDeck.set(job.current.row.id, list)\n  })\n\n  for (const item of loaded) {\n    if (!item.payload.deck) continue\n    const results = previewResultsByDeck.get(item.current.row.id) ?? []\n    const taggedId = findTaggedDeckPreviewSheet(storage.metadata, item.current.row.id)?.sheetId\n    const taggedResult = typeof taggedId === "number"\n      ? results.find((result) => result.properties.sheetId === taggedId)\n      : undefined\n    if (taggedResult?.error) throw taggedResult.error\n\n    const parsed = results.flatMap((result) => (\n      result.deck ? [{ properties: result.properties, deck: result.deck }] : []\n    ))\n    if (parsed.length === 0) {\n      const parseError = results.find((result) => result.error)?.error\n      if (parseError) throw parseError\n      await writeDeckPreview(client, storage.metadata, item.current.row.id, item.payload.deck, fetchImpl)\n      continue\n    }\n\n    const selected = selectParsedPreview(storage.metadata, item.current.row.id, item.payload.deck, parsed)\n    if (typeof selected.properties.sheetId === "number") {\n      await tagDeckPreviewSheet(client, storage.metadata, selected.properties.sheetId, item.current.row.id, fetchImpl)\n    }\n    if (samePreviewRows(previewRows(item.payload.deck), previewRows(selected.deck))) continue\n\n    const result = await putGoogleSheetsDeck(client, item.current.row.id, {\n      expectedRev: item.current.revision,\n      deck: selected.deck,\n      editorState: item.payload.editorState,\n    }, fetchImpl, session)\n    if (result.ok && selected.properties.sheetId != null) {\n      await writeDeckPreview(\n        client,\n        storage.metadata,\n        item.current.row.id,\n        selected.deck,\n        fetchImpl,\n        selected.properties.sheetId\n      )\n    }\n  }\n}\n'''
          sheets = sheets[:start] + replacement + sheets[end:]
          path.write_text(sheets)

          # Sync client errors that can reach the UI are English.
          path = Path("lib/sync-client.ts")
          client = path.read_text()
          client_replacements = {
              '"云端卡包是空的"': '"Cloud deck payload is empty"',
              '"云同步不可用"': '"Cloud sync unavailable"',
              '"未命名卡包"': '"Untitled deck"',
              '"同步失败"': '"Sync failed"',
              '`${local.deck.name} 本机`': '`${local.deck.name} (local copy)`',
              '"覆盖云端失败，请稍后再同步"': '"Couldn’t overwrite the cloud deck. Try syncing again."',
          }
          for old, new in client_replacements.items():
              client = client.replace(old, new)
          # Never leak parseDeckJson's localized validation messages through sync.
          client = replace_once(
              client,
              '  const deck = parseDeckJson(JSON.stringify(payload.deck))\n',
              '  let deck\n  try {\n    deck = parseDeckJson(JSON.stringify(payload.deck))\n  } catch {\n    throw new Error("Cloud deck content is invalid")\n  }\n',
              "sync client deck parse wrapper",
          )
          path.write_text(client)

          # English API responses for every Google Sheets / sync route.
          route_replacements = {
              "app/api/sync/decks/[id]/route.ts": {
                  '"卡包 id 无效"': '"Invalid deck ID"',
                  '"云端没有这个卡包"': '"Cloud deck not found"',
                  '"读取云端卡包失败"': '"Couldn’t read the cloud deck"',
                  '"请求无法解析"': '"Invalid JSON request"',
                  '"版本冲突"': '"Revision conflict"',
                  '"保存云端卡包失败"': '"Couldn’t save the cloud deck"',
              },
              "app/api/sync/route.ts": {
                  '"读取云端目录失败"': '"Couldn’t read the cloud index"',
              },
              "app/api/sync/status/route.ts": {
                  '"无法连接 Google Sheets"': '"Unable to connect to Google Sheets"',
              },
              "app/api/sync/sheets/route.ts": {
                  '"无法读取表格工作表"': '"Couldn’t read Google Sheet worksheets"',
              },
              "app/api/google-sheets/connect/route.ts": {
                  '"请求无法解析"': '"Invalid JSON request"',
                  '"Google Sheet 链接无效"': '"Invalid Google Sheet link"',
                  '"无法连接这个 Google Sheet"': '"Unable to connect to this Google Sheet"',
              },
              "app/api/google-sheets/create/route.ts": {
                  '"Anki Studio · 闪卡同步"': '"Anki Studio · Flashcard Sync"',
                  '"无法在 Google Drive 中创建表格"': '"Unable to create a spreadsheet in Google Drive"',
              },
              "app/api/google-sheets/list/route.ts": {
                  '"无法直接列出云端硬盘文件，您可以使用上方新建表格或直接粘贴表格链接"': '"Couldn’t list Google Drive files. Create a spreadsheet or paste a Google Sheet link instead."',
                  '"列出表格时发生错误"': '"An error occurred while listing spreadsheets"',
              },
          }
          for filename, replacements in route_replacements.items():
              route_path = Path(filename)
              route = route_path.read_text()
              for old, new in replacements.items():
                  route = route.replace(old, new)
              route_path.write_text(route)

          # README must describe current-state compaction, not revision history retention.
          path = Path("README.md")
          readme = path.read_text()
          readme = replace_once(
              readme,
              '- a hidden payload worksheet for full deck state and revision history;',
              '- a hidden payload worksheet for the current full deck state and revision metadata; old payload revisions are compacted after a successful write;',
              "README sync storage semantics",
          )
          path.write_text(readme)

          # Behavioral tests for malformed previews and fields beyond column Z.
          path = Path("tests/unit/lib/google-sheets-sync.test.ts")
          tests = path.read_text()
          anchor = '  it("reuses an existing titled preview when its metadata is missing", async () => {'
          addition = '''  it("surfaces a malformed authoritative preview instead of silently skipping it", async () => {\n    const api = createSheetsApi()\n    const deck = createDefaultDeck()\n    const saved = await putGoogleSheetsDeck(client, "malformed-preview", {\n      expectedRev: 0,\n      deck,\n    }, api.fetchImpl)\n    expect(saved.ok).toBe(true)\n\n    const preview = previewSheets(api)[0]\n    if (!preview) throw new Error("expected preview sheet")\n    api.setValues(preview.sheetId, [\n      ["broken_header", ...deck.fields],\n      ...(preview.values.slice(1)),\n    ])\n\n    await expect(listGoogleSheetsIndex(client, api.fetchImpl)).rejects.toThrow("modified header")\n  })\n\n  it("reads editable preview fields beyond column Z", async () => {\n    const api = createSheetsApi()\n    const source = createDefaultDeck()\n    const extraFields = Array.from({ length: 24 }, (_, index) => `Extra${index + 1}`)\n    const fields = [...source.fields, ...extraFields]\n    const extraValues = Object.fromEntries(extraFields.map((field) => [field, ""]))\n    const deck = {\n      ...source,\n      fields,\n      fieldNotes: { ...source.fieldNotes, ...extraValues },\n      cards: source.cards.map((card) => ({\n        ...card,\n        values: { ...card.values, ...extraValues },\n      })),\n    }\n    const saved = await putGoogleSheetsDeck(client, "wide-preview", {\n      expectedRev: 0,\n      deck,\n    }, api.fetchImpl)\n    expect(saved.ok).toBe(true)\n\n    const preview = previewSheets(api)[0]\n    if (!preview) throw new Error("expected preview sheet")\n    const values = structuredClone(preview.values)\n    const lastField = fields.at(-1)!\n    values[1]![fields.length] = "edited beyond Z"\n    api.setValues(preview.sheetId, values)\n\n    const index = await listGoogleSheetsIndex(client, api.fetchImpl)\n    const revision = index[0]?.rev ?? 0\n    expect(saved.ok && revision > saved.rev).toBe(true)\n    await expect(getGoogleSheetsDeck(client, "wide-preview", api.fetchImpl)).resolves.toMatchObject({\n      rev: revision,\n      deck: {\n        cards: [{\n          reviewStatus: "pending",\n          values: { [lastField]: "edited beyond Z" },\n        }],\n      },\n    })\n  })\n\n'''
          tests = replace_once(tests, anchor, addition + anchor, "wide/malformed preview tests")
          path.write_text(tests)

          # Verify typed payload errors retain 400 status and stable code.
          path = Path("tests/unit/lib/sync-server.test.ts")
          tests = path.read_text()
          tests = replace_once(
              tests,
              'import { getSyncEnv } from "@/lib/sync-server"\n',
              'import { getSyncEnv, googleSheetsErrorResponse } from "@/lib/sync-server"\nimport { parsePutBody } from "@/lib/sync-payload"\n',
              "sync server test imports",
          )
          closing = '\n})\n'
          pos = tests.rfind(closing)
          if pos < 0:
              raise SystemExit("sync-server test describe closing not found")
          tests = tests[:pos] + '''\n\n  it("keeps invalid sync payloads as typed 400 responses", async () => {\n    let error: unknown\n    try {\n      parsePutBody({ expectedRev: 0 })\n    } catch (caught) {\n      error = caught\n    }\n    const response = googleSheetsErrorResponse(error, "Unexpected sync failure")\n    expect(response.status).toBe(400)\n    await expect(response.json()).resolves.toMatchObject({\n      code: "missing_deck_content",\n      error: "Deck content is missing",\n    })\n  })''' + tests[pos:]
          path.write_text(tests)

          # Contract coverage for English sync boundaries and README semantics.
          Path("tests/contracts/review-fixes.test.ts").write_text('''import { describe, expect, it } from "vitest"\n\nimport { readSource } from "./helpers/source"\n\nconst sheets = readSource("lib", "google-sheets-sync.ts")\nconst syncServer = readSource("lib", "sync-server.ts")\nconst syncPayload = readSource("lib", "sync-payload.ts")\nconst syncClient = readSource("lib", "sync-client.ts")\nconst syncErrors = readSource("lib", "sync-errors.ts")\nconst studio = readSource("components", "studio.tsx")\nconst home = readSource("components", "study-overview.tsx")\nconst readme = readSource("README.md")\nconst routes = [\n  readSource("app", "api", "sync", "route.ts"),\n  readSource("app", "api", "sync", "status", "route.ts"),\n  readSource("app", "api", "sync", "sheets", "route.ts"),\n  readSource("app", "api", "sync", "decks", "[id]", "route.ts"),\n  readSource("app", "api", "google-sheets", "connect", "route.ts"),\n  readSource("app", "api", "google-sheets", "create", "route.ts"),\n  readSource("app", "api", "google-sheets", "list", "route.ts"),\n]\n\ndescribe("code review fixes", () => {\n  it("returns Google Sheets additions and edits to pending review", () => {\n    expect(sheets).toContain("createPendingCard")\n    expect(sheets).toContain("const changed = !current ||")\n    expect(sheets).toContain('reviewStatus: "pending"')\n  })\n\n  it("does not silently swallow authoritative preview parse failures", () => {\n    expect(sheets).toContain("previewResultsByDeck")\n    expect(sheets).toContain("if (taggedResult?.error) throw taggedResult.error")\n    expect(sheets).toContain("if (parseError) throw parseError")\n  })\n\n  it("sizes preview reads from the actual field count", () => {\n    expect(sheets).toContain('return `A1:${columnName(deck.fields.length + 1)}`')\n    expect(sheets).not.toContain('PREVIEW_READ_RANGE = "A1:Z"')\n  })\n\n  it("keeps JSON as a full project backup while published exports stay approval-gated", () => {\n    expect(studio).toContain('new Blob([serializeDeck(deck)], { type: "application/json" })')\n    expect(studio).toContain("deckToCsv(exportDeck)")\n    expect(studio).toContain("serializeDeck(approvedDeck(deck))")\n  })\n\n  it("uses typed sync request errors instead of language-dependent status inference", () => {\n    expect(syncErrors).toContain("class SyncRequestError")\n    expect(syncServer).toContain("error instanceof SyncRequestError")\n    expect(syncPayload).toContain('"missing_deck_content"')\n  })\n\n  it("keeps sync user-facing boundaries in English", () => {\n    const combined = [syncPayload, syncClient, ...routes].join("\\n")\n    expect(combined).not.toMatch(/[\\u3400-\\u9fff]/)\n    expect(sheets.replace('"序号"', "")).not.toMatch(/[\\u3400-\\u9fff]/)\n  })\n\n  it("does not pluralize the invariant done label", () => {\n    expect(home).toContain('${stats.reviewedToday} done')\n    expect(home).not.toContain('countLabel(stats.reviewedToday, "done")')\n  })\n\n  it("documents payload compaction instead of retained revision history", () => {\n    expect(readme).toContain("old payload revisions are compacted after a successful write")\n    expect(readme).not.toContain("full deck state and revision history")\n  })\n})\n''')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/sync-errors.ts \
            lib/sync-payload.ts \
            lib/sync-server.ts \
            lib/google-sheets-sync.ts \
            lib/sync-client.ts \
            app/api/sync \
            app/api/google-sheets \
            README.md \
            tests/contracts/review-fixes.test.ts \
            tests/unit/lib/google-sheets-sync.test.ts \
            tests/unit/lib/sync-server.test.ts
          git diff --cached --check
          git commit -m "fix: close remaining sync review gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
