name: Temporary review cleanup

on:
  push:
    branches:
      - refactor/review-approval-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/card-editor.tsx")
          source = path.read_text().replace("  matchesReviewFilter,\n", "")
          path.write_text(source)

          path = Path("lib/deck.ts")
          source = path.read_text()
          old = '''function withCardReviewStatus(card: Card, status: CardReviewStatus): Card {\n  if (status === "pending") return { ...card, reviewStatus: "pending" }\n  const { reviewStatus: _reviewStatus, ...approved } = card\n  return approved\n}'''
          new = '''function withCardReviewStatus(card: Card, status: CardReviewStatus): Card {\n  if (status === "pending") return { ...card, reviewStatus: "pending" }\n  const approved = { ...card }\n  delete approved.reviewStatus\n  return approved\n}'''
          if source.count(old) != 1:
              raise SystemExit("review status helper not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/card-editor.tsx lib/deck.ts
          git diff --cached --check
          git commit -m "chore: clean review approval refactor"
          git push origin HEAD:${GITHUB_REF_NAME}
