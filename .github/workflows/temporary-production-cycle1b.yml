          Path('lib/studio-store.ts').write_text(r'''import { serializeDeck, type Deck } from "./deck"

export type DeckRecord = {
  id: string
  deck: Deck
  rev: number
  dirty: boolean
  updatedAt: number
  deletedAt?: number
}

export type LibraryMeta = {
  version: 1
  activeId: string
  order: string[]
}

export type SyncMeta = {
  hasSynced: boolean
  hasLocalEdits: boolean
  lastSyncAt?: number
  lastError?: string
}

export type StudioStore = {
  getMeta(): Promise<LibraryMeta | null>
  setMeta(meta: LibraryMeta): Promise<void>
  getRecord(id: string): Promise<DeckRecord | null>
  setRecord(record: DeckRecord): Promise<void>
  updateRecord(
    id: string,
    update: (current: DeckRecord | null) => DeckRecord | null
  ): Promise<DeckRecord | null>
  deleteRecord(id: string): Promise<void>
  listRecords(): Promise<DeckRecord[]>
  replaceRecordsIfUnchanged(
    expected: DeckRecord[],
    records: DeckRecord[],
    meta: LibraryMeta
  ): Promise<boolean>
  getSyncMeta(): Promise<SyncMeta | null>
  setSyncMeta(meta: SyncMeta): Promise<void>
}

let store: StudioStore | null = null

export function setStudioStore(next: StudioStore | null): void {
  store = next
}

export function getStudioStore(): StudioStore {
  if (!store) throw new Error("本机存储未初始化")
  return store
}

export function hasStudioStore(): boolean {
  return store !== null
}

export function isDeckId(id: string): boolean {
  return /^[a-zA-Z0-9_-]{6,80}$/.test(id)
}

export function cloneRecord(record: DeckRecord): DeckRecord {
  return {
    id: record.id,
    deck: record.deck,
    rev: record.rev,
    dirty: record.dirty,
    updatedAt: record.updatedAt,
    deletedAt: record.deletedAt,
  }
}

export function sameDeckRecord(
  left: DeckRecord | null | undefined,
  right: DeckRecord | null | undefined
): boolean {
  if (!left || !right) return left == null && right == null
  return left.id === right.id
    && left.rev === right.rev
    && left.dirty === right.dirty
    && left.updatedAt === right.updatedAt
    && left.deletedAt === right.deletedAt
    && serializeDeck(left.deck) === serializeDeck(right.deck)
}

export function sameDeckRecordSets(left: DeckRecord[], right: DeckRecord[]): boolean {
  if (left.length !== right.length) return false
  const leftSorted = [...left].sort((a, b) => a.id.localeCompare(b.id))
  const rightSorted = [...right].sort((a, b) => a.id.localeCompare(b.id))
  return leftSorted.every((record, index) => sameDeckRecord(record, rightSorted[index]))
}

export function createMemoryStore(seed?: {
  meta?: LibraryMeta | null
  records?: DeckRecord[]
  syncMeta?: SyncMeta | null
}): StudioStore {
  const records = new Map<string, DeckRecord>()
  for (const record of seed?.records ?? []) records.set(record.id, cloneRecord(record))
  let meta = seed?.meta ? { ...seed.meta, order: [...seed.meta.order] } : null
  let syncMeta = seed?.syncMeta ? { ...seed.syncMeta } : null

  return {
    async getMeta() {
      return meta ? { ...meta, order: [...meta.order] } : null
    },
    async setMeta(next) {
      meta = { ...next, order: [...next.order] }
    },
    async getRecord(id) {
      const record = records.get(id)
      return record ? cloneRecord(record) : null
    },
    async setRecord(record) {
      records.set(record.id, cloneRecord(record))
    },
    async updateRecord(id, update) {
      const current = records.get(id)
      const next = update(current ? cloneRecord(current) : null)
      if (next) records.set(id, cloneRecord(next))
      else records.delete(id)
      return next ? cloneRecord(next) : null
    },
    async deleteRecord(id) {
      records.delete(id)
    },
    async listRecords() {
      return [...records.values()].map(cloneRecord)
    },
    async replaceRecordsIfUnchanged(expected, nextRecords, nextMeta) {
      if (!sameDeckRecordSets([...records.values()], expected)) return false
      records.clear()
      for (const record of nextRecords) records.set(record.id, cloneRecord(record))
      meta = { ...nextMeta, order: [...nextMeta.order] }
      return true
    },
    async getSyncMeta() {
      return syncMeta ? { ...syncMeta } : null
    },
    async setSyncMeta(next) {
      syncMeta = { ...next }
    },
  }
}
''')

          Path('lib/studio-store-idb.ts').write_text(r'''import {
  sameDeckRecordSets,
  type DeckRecord,
  type LibraryMeta,
  type StudioStore,
  type SyncMeta,
} from "./studio-store"

const DB_NAME = "anki-studio.data.v1"
const DB_VERSION = 1
const KV = "kv"
const DECKS = "decks"
const META_KEY = "library"
const SYNC_KEY = "sync-meta"

function openDb(): Promise<IDBDatabase> {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION)
    request.onupgradeneeded = () => {
      const db = request.result
      if (!db.objectStoreNames.contains(KV)) db.createObjectStore(KV)
      if (!db.objectStoreNames.contains(DECKS)) db.createObjectStore(DECKS, { keyPath: "id" })
    }
    request.onsuccess = () => {
      const db = request.result
      db.onversionchange = () => db.close()
      resolve(db)
    }
    request.onerror = () => reject(request.error ?? new Error("Unable to open the local database"))
  })
}

function requestToPromise<T>(request: IDBRequest<T>): Promise<T> {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error ?? new Error("Local database operation failed"))
  })
}

function transactionDone(transaction: IDBTransaction): Promise<void> {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve()
    transaction.onerror = () => reject(transaction.error ?? new Error("Local database transaction failed"))
    transaction.onabort = () => reject(transaction.error ?? new Error("Local database transaction was aborted"))
  })
}

export function createIdbStore(): StudioStore {
  let dbPromise: Promise<IDBDatabase> | null = null
  const db = () => {
    if (!dbPromise) {
      dbPromise = openDb().catch((error) => {
        dbPromise = null
        throw error
      })
    }
    return dbPromise
  }

  return {
    async getMeta() {
      const conn = await db()
      const value = await requestToPromise(conn.transaction(KV, "readonly").objectStore(KV).get(META_KEY))
      return (value as LibraryMeta | undefined) ?? null
    },
    async setMeta(meta) {
      const conn = await db()
      const transaction = conn.transaction(KV, "readwrite")
      transaction.objectStore(KV).put(meta, META_KEY)
      await transactionDone(transaction)
    },
    async getRecord(id) {
      const conn = await db()
      const value = await requestToPromise(conn.transaction(DECKS, "readonly").objectStore(DECKS).get(id))
      return (value as DeckRecord | undefined) ?? null
    },
    async setRecord(record) {
      const conn = await db()
      const transaction = conn.transaction(DECKS, "readwrite")
      transaction.objectStore(DECKS).put(record)
      await transactionDone(transaction)
    },
    async updateRecord(id, update) {
      const conn = await db()
      const transaction = conn.transaction(DECKS, "readwrite")
      const objectStore = transaction.objectStore(DECKS)
      let next: DeckRecord | null = null
      let updateError: unknown = null
      const done = new Promise<DeckRecord | null>((resolve, reject) => {
        transaction.oncomplete = () => resolve(next)
        transaction.onerror = () => reject(transaction.error ?? new Error("Local database transaction failed"))
        transaction.onabort = () => reject(updateError ?? transaction.error ?? new Error("Local database transaction was aborted"))
      })
      const request = objectStore.get(id)
      request.onsuccess = () => {
        try {
          const current = (request.result as DeckRecord | undefined) ?? null
          next = update(current)
          if (next) objectStore.put(next)
          else if (current) objectStore.delete(id)
        } catch (error) {
          updateError = error
          transaction.abort()
        }
      }
      return done
    },
    async deleteRecord(id) {
      const conn = await db()
      const transaction = conn.transaction(DECKS, "readwrite")
      transaction.objectStore(DECKS).delete(id)
      await transactionDone(transaction)
    },
    async listRecords() {
      const conn = await db()
      const value = await requestToPromise(conn.transaction(DECKS, "readonly").objectStore(DECKS).getAll())
      return (value as DeckRecord[]) ?? []
    },
    async replaceRecordsIfUnchanged(expected, records, meta) {
      const conn = await db()
      const transaction = conn.transaction([DECKS, KV], "readwrite")
      const deckStore = transaction.objectStore(DECKS)
      const metaStore = transaction.objectStore(KV)
      let replaced = false
      let updateError: unknown = null
      const done = new Promise<boolean>((resolve, reject) => {
        transaction.oncomplete = () => resolve(replaced)
        transaction.onerror = () => reject(transaction.error ?? new Error("Local database transaction failed"))
        transaction.onabort = () => reject(updateError ?? transaction.error ?? new Error("Local database transaction was aborted"))
      })
      const request = deckStore.getAll()
      request.onsuccess = () => {
        try {
          const current = (request.result as DeckRecord[]) ?? []
          if (!sameDeckRecordSets(current, expected)) return
          replaced = true
          deckStore.clear()
          for (const record of records) deckStore.put(record)
          metaStore.put(meta, META_KEY)
        } catch (error) {
          updateError = error
          transaction.abort()
        }
      }
      return done
    },
    async getSyncMeta() {
      const conn = await db()
      const value = await requestToPromise(conn.transaction(KV, "readonly").objectStore(KV).get(SYNC_KEY))
      return (value as SyncMeta | undefined) ?? null
    },
    async setSyncMeta(meta) {
      const conn = await db()
      const transaction = conn.transaction(KV, "readwrite")
      transaction.objectStore(KV).put(meta, SYNC_KEY)
      await transactionDone(transaction)
    },
  }
}
''')

