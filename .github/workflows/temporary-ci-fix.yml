name: Temporary CI fix

on:
  push:
    branches:
      - fix/review-gate-sync-readme

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/unit/lib/google-sheets-sync.test.ts",
              'expect(SHEETS_QUOTA_USER_MESSAGE).toContain("过于频繁")',
              'expect(SHEETS_QUOTA_USER_MESSAGE).toContain("too frequently")',
          )
          replace_once(
              "tests/contracts/review-fixes.test.ts",
              "expect(home).toContain('`${stats.reviewedToday} done`')",
              "expect(home).toContain('${stats.reviewedToday} done')",
          )
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/lib/google-sheets-sync.test.ts tests/contracts/review-fixes.test.ts
          git diff --cached --check
          git commit -m "test: align review fix expectations"
          git push origin HEAD:${GITHUB_REF_NAME}
