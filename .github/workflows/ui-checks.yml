name: UI checks

on:
  push:
    branches:
      - main
      - fix/review-gate-sync-readme
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-production-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/review-gate-sync-readme' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/review-gate-sync-readme

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply cycle 2 hardening
        run: python .github/production-cycle2.py

      - name: Install dependencies
        run: npm ci

      - name: Lint patched tree
        run: npm run lint

      - name: Typecheck patched tree
        run: npm run typecheck

      - name: Test patched tree
        run: npm test

      - name: Build patched tree
        run: npm run build

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/studio.tsx \
            lib/tts.ts \
            lib/ai-upstream.ts \
            lib/ai-compat.ts \
            lib/request-guard.ts \
            app/api/tts/route.ts \
            app/api/gemini-live/token/route.ts \
            lib/apkg.ts \
            next.config.ts \
            tests/unit/lib/tts.test.ts \
            tests/unit/lib/ai-upstream.test.ts \
            tests/unit/lib/request-guard.test.ts \
            tests/unit/lib/apkg-import.test.ts \
            tests/contracts/production-safety.test.ts
          git diff --cached --check
          git commit -m "fix: close production safety gaps"
          git push origin HEAD:fix/review-gate-sync-readme

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app and tests
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
