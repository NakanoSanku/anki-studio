name: UI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-production-readiness:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.head_ref == 'fix/review-gate-sync-readme'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply cycle 1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temporary-production-cycle1.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          tail = source[start:]
          lines = tail.splitlines()
          body = []
          for line in lines:
              if line.strip() == 'PY':
                  break
              body.append(line)
          script = textwrap.dedent('\n'.join(body)) + '\n'
          Path('/tmp/production-cycle1.py').write_text(script)
          PY
          python /tmp/production-cycle1.py

      - name: Install dependencies
        run: npm ci

      - name: Lint patched tree
        run: npm run lint

      - name: Typecheck patched tree
        run: npm run typecheck

      - name: Test patched tree
        run: npm test

      - name: Build patched tree
        run: npm run build

      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/studio-store.ts lib/studio-store-idb.ts lib/library.ts lib/sync-client.ts components/studio.tsx tests/unit/lib/library.test.ts tests/unit/lib/sync-client.test.ts tests/contracts/storage-durability.test.ts
          git diff --cached --check
          git commit -m "fix: harden local persistence and sync concurrency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app and tests
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
