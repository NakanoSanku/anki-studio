name: Temporary reference clear top right

on:
  push:
    branches:
      - fix/reference-clear-top-right

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Move clear selection into picker header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("components/reference-notes-bar.tsx")
          source = path.read_text()

          old = '''        <SheetHeader className="shrink-0 px-5 pb-3 pt-5">\n          <div className="mb-1 flex items-center justify-between gap-3 pr-8">\n            <div className="min-w-0">\n              <div className="mb-2 flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.17em] text-muted-foreground">\n                <span className="size-2 rounded-full bg-energy" />\n                Style memory\n              </div>\n              <SheetTitle className="text-[28px] font-semibold tracking-[-0.045em]">Reference notes</SheetTitle>\n            </div>\n            <Badge className="h-8 border border-black/[0.06] bg-muted px-3 text-xs font-medium text-foreground shadow-none dark:border-white/[0.08]">\n              {referenceIds.length} selected\n            </Badge>\n          </div>\n          <SheetDescription className="max-w-md text-xs leading-5">\n            Choose a few strong examples. AI Fill and batch generation will follow their formatting, pronunciation, meaning, and example style without copying the entries.\n          </SheetDescription>\n          {referenceIds.length > 0 ? (\n            <Button\n              type="button"\n              variant="ghost"\n              size="sm"\n              className="mt-1 h-8 w-fit px-2 text-xs text-muted-foreground"\n              onClick={() => onChange([])}\n            >\n              <RotateCcw className="size-3" />\n              Clear selection\n            </Button>\n          ) : null}\n        </SheetHeader>'''

          new = '''        <SheetHeader className="shrink-0 px-5 pb-3 pt-5">\n          <div className="mb-2 flex items-center justify-between gap-3 pr-8">\n            <div className="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.17em] text-muted-foreground">\n              <span className="size-2 rounded-full bg-energy" />\n              Style memory\n            </div>\n            {referenceIds.length > 0 ? (\n              <Button\n                type="button"\n                variant="ghost"\n                size="sm"\n                aria-label="Clear reference selection"\n                className="h-8 px-2 text-xs text-muted-foreground"\n                onClick={() => onChange([])}\n              >\n                <RotateCcw className="size-3" />\n                Clear selection\n              </Button>\n            ) : null}\n          </div>\n          <div className="mb-1 flex items-center justify-between gap-3 pr-8">\n            <SheetTitle className="min-w-0 text-[28px] font-semibold tracking-[-0.045em]">Reference notes</SheetTitle>\n            <Badge className="h-8 shrink-0 border border-black/[0.06] bg-muted px-3 text-xs font-medium text-foreground shadow-none dark:border-white/[0.08]">\n              {referenceIds.length} selected\n            </Badge>\n          </div>\n          <SheetDescription className="max-w-md text-xs leading-5">\n            Choose a few strong examples. AI Fill and batch generation will follow their formatting, pronunciation, meaning, and example style without copying the entries.\n          </SheetDescription>\n        </SheetHeader>'''

          source = replace_once(source, old, new, "reference picker header")
          path.write_text(source)

          test_path = Path("tests/contracts/ui/notes-list.test.ts")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              'const editor = readSource("components", "card-editor.tsx")\nconst studio = readSource("components", "studio.tsx")',
              'const editor = readSource("components", "card-editor.tsx")\nconst references = readSource("components", "reference-notes-bar.tsx")\nconst studio = readSource("components", "studio.tsx")',
              "reference source import",
          )
          anchor = '''  it("hides the batch dialog while the reference-notes sheet is open", () => {\n    expect(editor).toContain("batchOpen && !referencePickerOpen")\n  })\n'''
          replacement = anchor + '''\n  it("keeps clear selection in the upper-right of the reference picker", () => {\n    expect(references).toContain('className="mb-2 flex items-center justify-between gap-3 pr-8"')\n    expect(references).toContain('aria-label="Clear reference selection"')\n    expect(references).toContain("Clear selection")\n    expect(references).not.toContain('className="mt-1 h-8 w-fit px-2 text-xs text-muted-foreground"')\n  })\n'''
          tests = replace_once(tests, anchor, replacement, "reference clear placement contract")
          test_path.write_text(tests)
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/reference-notes-bar.tsx tests/contracts/ui/notes-list.test.ts
          git diff --cached --check
          git commit -m "fix: move reference clear action to header"
          git push origin HEAD:${GITHUB_REF_NAME}
